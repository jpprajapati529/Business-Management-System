apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: <ServiceName>
  replicas: 2
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres-container
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
          - name: POSTGRES-DB
            value: businessproject
          - name: POSTGRES-USER
            value: postgres
          - name: POSTGRES-PASSWORD
            value: root

        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
